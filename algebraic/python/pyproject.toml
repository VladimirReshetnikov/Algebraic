[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algebraic"
version = "1.0.0"
description = "Exact computation with polynomials and algebraic numbers: functional decomposition, sums and products of smallest maximum degree, and radical expressions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT-0"
authors = [{ name = "Vladimir Reshetnikov" }]
keywords = ["algebraic numbers", "Galois theory", "polynomial decomposition", "radicals", "exact arithmetic"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["sympy>=1.14", "python-flint>=0.8"]

[project.urls]
Homepage = "https://github.com/VladimirReshetnikov/Algebraic"

[tool.setuptools]
packages = ["algebraic"]

[tool.setuptools.package-dir]
"" = "."

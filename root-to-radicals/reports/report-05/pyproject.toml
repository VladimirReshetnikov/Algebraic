[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radicalsolve-reference"
version = "0.1.0"
description = "Exact branch-aware radical conversion using structural reductions and Galois/Fourier descent"
requires-python = ">=3.10"
dependencies = ["sympy==1.14.0"]
license = "MIT-0"

[project.scripts]
radicalsolve = "radicalsolve.__main__:main"

[tool.setuptools.packages.find]
where = ["python"]

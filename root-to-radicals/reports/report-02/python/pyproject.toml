[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radicalroot-reference"
version = "0.1.0"
description = "Exact radical conversion with a Galois/Kummer reference backend"
requires-python = ">=3.10"
dependencies = ["sympy>=1.14,<1.15"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
radicalroot = "radicalroot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["radicalroot*"]
